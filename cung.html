      function drawAimLine(aimOffset) {
        const targetX = centerX + aimOffset;
        const arrowColor = "#f4d27a";
        const aimTargetY = laneTopY;
        const heldBall = bowlerReleasePosition ?? getHeldBallPosition();
        context.strokeStyle = `${arrowColor}cc`;
        context.lineWidth = 4;
        context.setLineDash([9, 12]);
        context.beginPath();
        context.moveTo(heldBall.x, heldBall.y - 18);
        context.lineTo(targetX, aimTargetY);
        context.stroke();
        context.setLineDash([]);
        context.fillStyle = arrowColor;
        context.beginPath();
        context.moveTo(targetX, aimTargetY - 11);
        context.lineTo(targetX - 10, aimTargetY + 7);
        context.lineTo(targetX + 10, aimTargetY + 7);
        context.closePath();
        context.fill();
      }

      function updateControls() {
        powerMeter.setAttribute("aria-valuenow", String(Math.round(chargePower)));
        powerMeterFill.style.width = `${chargePower}%`;
        syncThrowButtonLabel();
        drawLane();
      }

      function disableSound(error) {
        soundEnabled = false;
        console.error("Không thể phát hiệu ứng âm thanh:", error);
      }

      function getAudioContext() {
        if (!soundEnabled) {
          return null;
        }

        const AudioContextConstructor = window.AudioContext ?? window.webkitAudioContext;
        if (!AudioContextConstructor) {
          soundEnabled = false;
          console.warn("Trình duyệt này không hỗ trợ Web Audio API.");
          return null;
        }

        try {
          if (!audioContext) {
            audioContext = new AudioContextConstructor();
            masterGain = audioContext.createGain();
            masterGain.gain.value = 0.5;

            const compressor = audioContext.createDynamicsCompressor();
            compressor.threshold.value = -18;
            compressor.knee.value = 20;
            compressor.ratio.value = 3;
            compressor.attack.value = 0.004;
            compressor.release.value = 0.24;
            compressor.connect(audioContext.destination);
            masterGain.connect(compressor);

            const reverb = audioContext.createConvolver();
            const impulseDuration = 1.4;
            const impulse = audioContext.createBuffer(
              2,
              Math.ceil(audioContext.sampleRate * impulseDuration),
              audioContext.sampleRate,
            );
            for (let channel = 0; channel < impulse.numberOfChannels; channel += 1) {
              const samples = impulse.getChannelData(channel);
              for (let index = 0; index < samples.length; index += 1) {
                const decay = (1 - index / samples.length) ** 2.8;
                samples[index] = (Math.random() * 2 - 1) * decay;
              }
            }
            reverb.buffer = impulse;
            const roomGain = audioContext.createGain();
            roomGain.gain.value = 0.19;
            masterGain.connect(reverb);
            reverb.connect(roomGain);
            roomGain.connect(compressor);
          }

          if (audioContext.state === "suspended") {
            audioContext.resume().catch(disableSound);
          }
          return audioContext;
        } catch (error) {
          disableSound(error);
          return null;
        }
      }

      function playTone(frequency, endFrequency, startAt, duration, volume, type = "sine") {
        const audio = getAudioContext();
        if (!audio) {
          return;
        }

        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startAt);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), startAt + duration);
        gain.gain.setValueAtTime(0.0001, startAt);
        gain.gain.linearRampToValueAtTime(volume, startAt + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        oscillator.connect(gain);
        gain.connect(masterGain);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration);
      }

      function playNoise(duration, startFrequency, endFrequency, volume, scheduledAt) {
        const audio = getAudioContext();
        if (!audio) {
          return;
        }

        const startAt = Math.max(audio.currentTime, scheduledAt ?? audio.currentTime);
        const sampleCount = Math.ceil(audio.sampleRate * duration);
        const buffer = audio.createBuffer(1, sampleCount, audio.sampleRate);
        const samples = buffer.getChannelData(0);
        for (let index = 0; index < sampleCount; index += 1) {
          samples[index] = Math.random() * 2 - 1;
        }

        const source = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        const gain = audio.createGain();
        source.buffer = buffer;
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(startFrequency, startAt);
        filter.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), startAt + duration);
        filter.Q.value = 0.7;
        gain.gain.setValueAtTime(0.0001, startAt);
        gain.gain.linearRampToValueAtTime(volume, startAt + 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        source.start(startAt);
        source.stop(startAt + duration);
      }

      function playArrowLaunchSound() {
        const audio = getAudioContext();
        if (!audio) {
          return;
        }

        const startAt = audio.currentTime;
        playNoise(0.32, 2600, 380, 0.09, startAt);
        playTone(520, 190, startAt, 0.16, 0.045, "triangle");
      }

      function playArrowImpactSound() {
        const audio = getAudioContext();
        if (!audio) {
          return;
        }

        const startAt = audio.currentTime;
        playNoise(0.13, 520, 95, 0.2, startAt);
        playNoise(0.055, 1900, 620, 0.055, startAt);
        playTone(145, 52, startAt, 0.19, 0.19, "triangle");
      }

      function playRollingSound(duration, scheduledAt, includeThump = false) {
        const audio = getAudioContext();
        if (!audio) {
          return;
        }

        const startAt = Math.max(audio.currentTime, scheduledAt ?? audio.currentTime);
        if (includeThump) {
          playNoise(0.11, 260, 70, 0.12, startAt);
          playTone(105, 45, startAt, 0.16, 0.12, "triangle");
        }
        playNoise(duration, 420, 95, 0.08, startAt);
        playNoise(duration, 1500, 480, 0.035, startAt);
        playTone(86, 42, startAt, duration, 0.17);
        for (let offset = 0.12; offset < duration; offset += 0.24) {
          playNoise(0.035, 1050, 360, 0.018, startAt + offset);
        }
      }

      function playPinCrash(pinCount) {
        const audio = getAudioContext();
        if (!audio) {
          return;
        }

        const startAt = audio.currentTime;
        playNoise(pinCount > 0 ? 0.72 : 0.38, pinCount > 0 ? 1750 : 520, 95, pinCount > 0 ? 0.24 : 0.12, startAt);
        playTone(pinCount > 0 ? 112 : 76, 35, startAt, 0.52, 0.24);

        for (let index = 0; index < Math.min(pinCount * 2, 12); index += 1) {
          const offset = 0.035 + index * 0.045 + Math.random() * 0.025;
          const clackFrequency = 1800 + Math.random() * 1500;
          playNoise(0.085 + Math.random() * 0.06, clackFrequency, 350, 0.075, startAt + offset);
          playTone(280 + Math.random() * 260, 70 + Math.random() * 80, startAt + offset, 0.17, 0.035, "triangle");
        }
      }

      function calculateKnockdown(aimOffset, power, endY, startX, startY) {
        const hit = new Set();
        const hitRadius = 12 + power * 0.055;
        const targetX = centerX + aimOffset;

        for (let index = 0; index < pins.length; index += 1) {
          const pin = pins[index];
          if (pin.fallen || pin.y < endY) {
            continue;
          }

          const pathRatio = (startY - pin.y) / (startY - laneTopY);
          const ballX = startX + (targetX - startX) * pathRatio;
          if (Math.abs(ballX - centerX) > getLaneHalfWidth(pin.y) - 12) {
            continue;
          }
          const pinRadius = 14 + pin.row * 2;
          if (Math.abs(pin.x - ballX) < hitRadius + pinRadius) {
            hit.add(index);
          }
        }

        for (let row = 0; row < 3; row += 1) {
          for (let index = 0; index < pins.length; index += 1) {
            if (!hit.has(index) || pins[index].row !== row) {
              continue;
            }

            for (let nextIndex = 0; nextIndex < pins.length; nextIndex += 1) {
              const nextPin = pins[nextIndex];
              if (!nextPin.fallen && nextPin.row === row + 1 && Math.abs(nextPin.x - pins[index].x) <= 60) {
                const chainChance = 0.12 + power * 0.002;
                if (Math.random() < chainChance) {
                  hit.add(nextIndex);
                }
              }
            }
          }
        }

        return hit;
      }

      function getRollEndpoint(aimOffset, power, startX, startY) {
        const endY = 190 - (power - 50) * 2.2;
        let lastOnLaneY = startY;
        const targetX = centerX + aimOffset;

        for (let y = startY; y >= endY; y -= 4) {
          const pathRatio = (startY - y) / (startY - laneTopY);
          const ballX = startX + (targetX - startX) * pathRatio;
          if (Math.abs(ballX - centerX) > getLaneHalfWidth(y) - 14) {
            break;
          }
          lastOnLaneY = y;
        }

        const finalY = lastOnLaneY === startY ? endY : Math.max(endY, lastOnLaneY);
        const pathRatio = (startY - finalY) / (startY - laneTopY);
        return {
          x: startX + (targetX - startX) * pathRatio,
          y: finalY,
        };
      }

      function updateChargeProgress() {
        if (throwChargePhase !== "charging") {
          chargeAnimationFrame = null;
          return;
        }

        const elapsed = performance.now() - chargeStartTime;
        chargePower = Math.min(100, 50 + elapsed / 900 * 50);
        updateControls();
        chargeAnimationFrame = requestAnimationFrame(updateChargeProgress);
      }

      function startHoldingThrow() {
        if (!gameStarted || gameFinished || shotTaken || pendingArrow || ball || throwChargePhase === "charging") {
          return;
        }

        if (gameMode === "solo" && currentArrowIndex >= 10) {
          return;
        }

        getAudioContext();
        if (!game.classList.contains("is-scoreboard-collapsed")) {
          rollsSinceScoreboardCollapsed = 0;
          setScoreboardCollapsed(true);
        }
        throwChargePhase = "charging";
        chargePower = 50;
        chargeStartTime = performance.now();
        targetMotionActive = true;
        targetZoomed = true;
        targetTransitionStart = chargeStartTime;
        targetTransitionDuration = 900;
        targetStart = { ...frozenTargetPosition };
        lastTargetSample = { ...frozenTargetPosition, time: chargeStartTime };
        targetEnd = {
          x: 350 + Math.random() * 100,
          y: 505 + Math.random() * 112,
        };
        powerField.hidden = false;
        if (gameMode === "solo") {
          powerField.hidden = true;
        }
        updateControls();
        chargeAnimationFrame = requestAnimationFrame(updateChargeProgress);
      }

      function releaseHoldingThrow() {
        if (throwChargePhase !== "charging") {
          return;
        }

        const releasedAt = performance.now();
        const aimPoint = getAimPoint(releasedAt);
        freezeTargetPosition(releasedAt);
        if (chargeAnimationFrame !== null) {
          cancelAnimationFrame(chargeAnimationFrame);
          chargeAnimationFrame = null;
        }

        chargePower = Math.max(50, Math.min(100, Math.round(chargePower)));
        throwChargePhase = "idle";
        powerField.hidden = true;
        if (gameMode === "solo") {
          fireSoloArrow(aimPoint);
          return;
        }
        fireOnlineArrow(aimPoint);
      }

      function cancelHoldingThrow() {
        if (throwChargePhase !== "charging") {
          return;
        }
        if (chargeAnimationFrame !== null) {
          cancelAnimationFrame(chargeAnimationFrame);
          chargeAnimationFrame = null;
        }
        throwChargePhase = "idle";
        chargePower = 50;
        powerField.hidden = true;
        freezeTargetPosition();
        targetZoomed = false;
        if (rollsSinceScoreboardCollapsed === 0) {
          setScoreboardCollapsed(false);
        }
        updateControls();
      }

      function getArrowScore(aimPoint, target) {
        const distance = Math.hypot(aimPoint.x - target.x, aimPoint.y - target.y);
        const targetRadius = 70;
        if (distance > targetRadius) {
          return 0;
        }
        return Math.min(10, Math.max(1, 11 - Math.ceil(distance / targetRadius * 10)));
      }

      function animateSoloArrow(aimPoint, onImpact) {
        const startedAt = performance.now();
        const flightDuration = ARCHERY_DISTANCE_METERS / ARROW_SPEED_METERS_PER_SECOND * 1000;
        firedArrow = {
          startX: centerX,
          startY: 1090,
          x: aimPoint.x,
          y: aimPoint.y,
          progress: 0,
        };
        playArrowLaunchSound();

        function animate(now) {
          firedArrow.progress = Math.min(1, (now - startedAt) / flightDuration);
          drawLane();
          if (firedArrow.progress < 1) {
            animationFrame = requestAnimationFrame(animate);
            return;
          }
          playArrowImpactSound();
          firedArrow = null;
          animationFrame = null;
          onImpact(aimPoint, getTargetPosition(now));
        }

        animationFrame = requestAnimationFrame(animate);
      }

      function fireSoloArrow(aimPoint) {
        shotTaken = true;
        throwButton.disabled = true;
        powerField.hidden = true;
        animateSoloArrow(aimPoint, (arrowPoint, target) => {
          if (recordTargetMark(arrowPoint, target)) {
            animateTargetDetailImpact();
          }
          const score = getArrowScore(arrowPoint, target);
          const player = gamePlayers[0];
          player.arrows[currentArrowIndex] = score;
          player.score += score;
          freezeTargetPosition();
          targetZoomed = false;
          setScoreboardCollapsed(false);
          drawLane();
          gameStatus.textContent = score === 10
            ? "Hồng tâm! Bạn được 10 điểm."
            : `Mũi tên được ${score} điểm. Cung thủ máy chuẩn bị bắn…`;
          renderRoomBoard();
          npcTimeout = window.setTimeout(playNpcTurn, 850);
        });
      }

      function fireOnlineArrow(aimPoint) {
        shotTaken = true;
        throwButton.disabled = true;
        powerField.hidden = true;
        animateSoloArrow(aimPoint, (arrowPoint, target) => {
          if (recordTargetMark(arrowPoint, target)) {
            animateTargetDetailImpact();
          }
          drawLane();
          const ownPlayer = gamePlayers.find((player) => player.id === playerId);
          if (!ownPlayer) {
            gameStatus.textContent = "Không tìm thấy người chơi trong phòng.";
            throwButton.disabled = false;
            return;
          }
          pendingArrow = {
            arrowId: window.crypto?.randomUUID?.()
              ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            arrowIndex: ownPlayer.arrows.length,
            score: getArrowScore(arrowPoint, target),
          };
          setScoreboardCollapsed(false);
          gameStatus.textContent = `Bạn được ${pendingArrow.score} điểm · đang lưu kết quả…`;
          renderRoomBoard();
          submitPendingArrow();
        });
      }

      async function submitPendingArrow() {
        if (!pendingArrow) {
          return;
        }

        throwButton.disabled = true;
        throwButton.textContent = "Đang lưu…";
        try {
          const submittedArrow = pendingArrow;
          const response = await emitRoomCommand("archery_record_arrow", {
            roomCode,
            arrowId: submittedArrow.arrowId,
            arrowIndex: submittedArrow.arrowIndex,
            score: submittedArrow.score,
          });
          if (pendingArrow?.arrowId !== submittedArrow.arrowId) {
            return;
          }
          pendingArrow = null;
          applyRoomState(response.room);
          if (!gameStarted) {
            return;
          }
          const ownPlayer = gamePlayers.find((player) => player.id === playerId);
          if (!ownPlayer) {
            throw new Error("Không tìm thấy người chơi trong phòng sau khi đồng bộ.");
          }
          currentArrowIndex = ownPlayer ? ownPlayer.arrows.length : 0;
          gameFinished = currentArrowIndex >= 10;
          targetMotionActive = false;
          targetZoomed = false;
          if (gameFinished) {
            gameStatus.textContent = `Bạn đã hoàn thành ván · tổng ${ownPlayer.score} điểm`;
            throwButton.disabled = false;
            syncThrowButtonLabel();
          } else {
            shotTaken = false;
            throwButton.disabled = false;
            gameStatus.textContent = `Đã lưu ${submittedArrow.score} điểm · mũi ${currentArrowIndex + 1}/10.`;
            syncThrowButtonLabel();
          }
          renderRoomBoard();
          drawLane();
        } catch (error) {
          gameStatus.textContent = `Chưa đồng bộ được điểm: ${error.message}`;
          throwButton.disabled = false;
          throwButton.textContent = "Thử đồng bộ";
        }
      }

      function playNpcTurn() {
        npcTimeout = null;
        targetMotionActive = true;
        targetZoomed = true;
        chargeStartTime = performance.now() - 3200;
        targetTransitionStart = performance.now();
        targetTransitionDuration = 260;
        targetStart = { ...frozenTargetPosition };
        targetEnd = {
          x: 350 + Math.random() * 100,
          y: 505 + Math.random() * 112,
        };
        const now = performance.now();
        const target = freezeTargetPosition(now);
        const angle = Math.random() * Math.PI * 2;
        const missDistance = (0.12 + Math.random() * 0.8) * 70;
        const aimPoint = {
          x: target.x + Math.cos(angle) * missDistance,
          y: target.y + Math.sin(angle) * missDistance,
        };
        gameStatus.textContent = "Cung thủ máy đang bắn…";
        animateSoloArrow(aimPoint, (arrow, impactTarget) => {
          if (recordTargetMark(arrow, impactTarget)) {
            animateTargetDetailImpact();
          }
          const score = getArrowScore(arrow, impactTarget);
          const npc = gamePlayers[1];
          npc.arrows[currentArrowIndex] = score;
          npc.score += score;
          currentArrowIndex += 1;
          freezeTargetPosition();
          targetZoomed = false;
          if (currentArrowIndex >= 10) {
            gameFinished = true;
            for (const player of gamePlayers) {
              player.history.push(player.score);
              soloMatchHistoryByPlayer.set(player.id, player.history);
            }
            const historySaved = saveSoloMatchHistory();
            gameStatus.textContent = `Ván kết thúc · ${gamePlayers[0].score}–${npc.score} điểm`;
            if (!historySaved) {
              gameStatus.textContent += " · không lưu được lịch sử trên thiết bị";
            }
            throwButton.disabled = false;
            syncThrowButtonLabel();
          } else {
            shotTaken = false;
            throwButton.disabled = false;
            gameStatus.textContent = `NPC được ${score} điểm · đến lượt mũi ${currentArrowIndex + 1}.`;
            syncThrowButtonLabel();
          }
          setScoreboardCollapsed(false);
          renderRoomBoard();
          drawLane();
        });
      }

      function shouldResetRackForNextRoll(frame, frameIndex, pinsDown) {
        const rolls = [...frame.rolls, pinsDown];
        if (isFrameComplete({ rolls }, frameIndex)) {
          return true;
        }
        if (frameIndex < 9) {
          return frame.rolls.length === 0 && pinsDown === 10;
        }
        return frameIndex === 9 && (
          (frame.rolls.length === 0 && pinsDown === 10)
          || (frame.rolls.length === 1 && frame.rolls[0] === 10 && pinsDown === 10)
          || (frame.rolls.length === 1 && frame.rolls[0] + pinsDown === 10)
        );
      }

      async function submitPendingRoll() {
        if (!pendingRoll) {
          return;
        }
        throwButton.disabled = true;
        throwButton.textContent = "Đang lưu…";
        try {
          const submittedRoll = pendingRoll;
          const response = await emitRoomCommand("record_roll", {
            roomCode,
            rollId: submittedRoll.rollId,
            frameIndex: submittedRoll.frameIndex,
            rollIndex: submittedRoll.rollIndex,
            pinsDown: submittedRoll.pinsDown,
          });
          if (pendingRoll?.rollId !== submittedRoll.rollId) {
            return;
          }
          pendingRoll = null;
          applyRoomState(response.room);
          if (!gameStarted || !roomCode) {
            return;
          }
          rollsSinceScoreboardCollapsed += 1;
          if (rollsSinceScoreboardCollapsed >= 2) {
            setScoreboardCollapsed(false);
          }
          const ownPlayer = gamePlayers.find((player) => player.id === playerId);
          if (!ownPlayer) {
            return;
          }
          currentFrameIndex = getCurrentFrameIndex(ownPlayer);
          gameFinished = currentFrameIndex < 0;
          pendingRackReset = submittedRoll.resetRack || currentFrameIndex !== submittedRoll.frameIndex;
          shotTaken = true;
          if (gameFinished) {
            if (ballReturning) {
              throwButton.textContent = "Bóng đang quay về…";
            } else {
              throwButton.disabled = false;
              throwButton.textContent = "Ván mới";
            }
          } else if (!ballReturning) {
            throwButton.textContent = "Đang chuẩn bị…";
            scheduleNextRollPreparation();
          } else {
            throwButton.textContent = "Bóng đang quay về…";
          }
        } catch (error) {
          gameStatus.textContent = `Chưa đồng bộ được điểm: ${error.message}`;
          throwButton.disabled = false;
          throwButton.textContent = "Thử đồng bộ";
        }
      }

      function throwBall(aimOffset, ballStart) {
        if (!gameStarted || gameFinished || shotTaken || ball) {
          return;
        }

        if (chargeAnimationFrame !== null) {
          cancelAnimationFrame(chargeAnimationFrame);
          chargeAnimationFrame = null;
        }

        const power = Math.max(50, Math.min(100, Math.round(chargePower)));
        const endpoint = getRollEndpoint(aimOffset, power, ballStart.x, ballStart.y);
        const hitPins = calculateKnockdown(aimOffset, power, endpoint.y, ballStart.x, ballStart.y);
        const start = performance.now();
        const duration = 2600 + (100 - power) * 6;
        const returnDuration = 2500;
        const impactY = pins.length ? pins[pins.length - 1].y : laneTopY;
        const impactProgress = endpoint.y < impactY
          ? (ballStart.y - impactY) / (ballStart.y - endpoint.y)
          : 1;
        const impactTime = duration * (1 - Math.cbrt(1 - impactProgress));
        const ownPlayer = gamePlayers.find((player) => player.id === playerId);
        const frameIndex = getCurrentFrameIndex(ownPlayer);
        const currentFrame = ownPlayer.frames[frameIndex];
        const rollIndex = currentFrame.rolls.length;
        let returnStartedAt = null;

        shotTaken = true;
        impactPlayed = false;
        throwButton.disabled = true;
        throwButton.textContent = "Bóng đang lăn…";
        ball = { ...ballStart };
        const rollSoundDelay = 0.3;
        if (impactTime > rollSoundDelay * 1000) {
          playRollingSound(
            (impactTime / 1000) - rollSoundDelay,
            (audioContext?.currentTime ?? 0) + rollSoundDelay,
            true,
          );
        }
        drawLane();

        function animate(now) {
          if (returnStartedAt === null) {
            const progress = Math.min(1, (now - start) / duration);
            const eased = 1 - (1 - progress) ** 3;
            ball.x = ballStart.x + (endpoint.x - ballStart.x) * eased;
            ball.y = ballStart.y + (endpoint.y - ballStart.y) * eased;

            if (eased >= impactProgress && !impactPlayed) {
              impactPlayed = true;
              playPinCrash(hitPins.size);
            }

            for (const index of hitPins) {
              const pin = pins[index];
              const pinImpactProgress = (ballStart.y - pin.y) / (ballStart.y - endpoint.y);
              if (eased >= pinImpactProgress && !pin.fallen) {
                const pathRatio = (ballStart.y - pin.y) / (ballStart.y - laneTopY);
                const ballXAtImpact = ballStart.x + (centerX + aimOffset - ballStart.x) * pathRatio;
                let direction = Math.sign(pin.x - ballXAtImpact);
                if (direction === 0) {
                  direction = Math.random() < 0.5 ? -1 : 1;
                }
                pin.fallen = true;
                pin.flight = {
                  startedAt: now,
                  elapsed: 0,
                  velocityX: direction * (105 + Math.random() * 175),
                  velocityY: -(250 + Math.random() * 150),
                  gravity: 560,
                  spin: (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random() * 9),
                };
              }
              if (pin.flight) {
                pin.flight.elapsed = Math.max(0, (now - pin.flight.startedAt) / 1000);
              }
            }

            if (progress < 1) {
              drawLane();
              animationFrame = requestAnimationFrame(animate);
              return;
            }

            const knockedDown = hitPins.size;
            for (const index of hitPins) {
              pins[index].removed = true;
            }

            pendingRoll = {
              rollId: window.crypto?.randomUUID?.()
                ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`,
              frameIndex,
              rollIndex,
              pinsDown: knockedDown,
              resetRack: shouldResetRackForNextRoll(currentFrame, frameIndex, knockedDown),
            };
            ballReturning = true;
            returnStartedAt = now;
            playRollingSound(returnDuration / 1000);
            throwButton.textContent = "Bóng đang quay về…";
            drawLane();
            submitPendingRoll();
            animationFrame = requestAnimationFrame(animate);
            return;
          }

          const returnProgress = Math.min(1, (now - returnStartedAt) / returnDuration);
          const easedReturn = 1 - (1 - returnProgress) ** 3;
          const edgeX = (y) => centerX + getLaneHalfWidth(y) - 26;
          if (easedReturn < 0.18) {
            const sideProgress = easedReturn / 0.18;
            ball.x = endpoint.x + (edgeX(endpoint.y) - endpoint.x) * sideProgress;
            ball.y = endpoint.y;
          } else if (easedReturn < 0.85) {
            const laneProgress = (easedReturn - 0.18) / 0.67;
            ball.y = endpoint.y + (ballStart.y - endpoint.y) * laneProgress;
            ball.x = edgeX(ball.y);
          } else {
            const homeProgress = (easedReturn - 0.85) / 0.15;
            ball.x = edgeX(ballStart.y) + (ballStart.x - edgeX(ballStart.y)) * homeProgress;
            ball.y = ballStart.y;
          }

          drawLane();
          if (returnProgress < 1) {
            animationFrame = requestAnimationFrame(animate);
            return;
          }

          ball = null;
          ballReturning = false;
          bowlerReleasePosition = null;
          animationFrame = null;
          if (gameFinished) {
            throwButton.disabled = false;
            throwButton.textContent = "Ván mới";
          } else if (!pendingRoll) {
            throwButton.textContent = "Đang chuẩn bị…";
            scheduleNextRollPreparation();
          }
          drawLane();
        }

        animationFrame = requestAnimationFrame(animate);
      }

      function resetGame() {
        if (gameMode === "solo" && gameFinished) {
          startSoloGame();
          return;
        }
        if (!gameStarted || !gameFinished) {
          return;
        }
        throwButton.disabled = true;
        gameStatus.textContent = "Đang bắt đầu ván mới…";
        emitRoomCommand("archery_restart_player", { roomCode })
          .then((response) => {
            applyRoomState(response.room);
            if (gameStarted) {
              prepareNextArrow();
            }
          })
          .catch((error) => {
            gameStatus.textContent = error.message;
            throwButton.disabled = false;
            throwButton.textContent = "Thử lại";
          });
      }

      throwButton.addEventListener("pointerdown", (event) => {
        throwButton.setPointerCapture(event.pointerId);
        startHoldingThrow();
      });
      throwButton.addEventListener("pointerup", releaseHoldingThrow);
      throwButton.addEventListener("pointercancel", cancelHoldingThrow);
      throwButton.addEventListener("click", (event) => {
        if (pendingArrow) {
          submitPendingArrow();
          return;
        }
        if (pendingRoll) {
          submitPendingRoll();
          return;
        }
        if (gameFinished) {
          resetGame();
          return;
        }
        if (event.detail === 0 && !shotTaken && throwChargePhase === "idle") {
          startHoldingThrow();
          releaseHoldingThrow();
        }
      });
      backToLobbyButton.addEventListener("click", returnToLobby);
      soloGameButton.addEventListener("click", startSoloGame);
      saveCharacterButton.addEventListener("click", savePlayerName);
      createGameButton.addEventListener("click", startGame);
      joinRoomButton.addEventListener("click", joinGame);
      roomCodeInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          joinGame();
        }
      });
      shareRoomButton.addEventListener("click", shareRoomLink);

      backgroundImage.addEventListener("load", drawLane);
      targetDetail.addEventListener("animationend", (event) => {
        if (event.animationName === "target-impact") {
          targetDetail.classList.remove("is-impact");
        }
      });
      backgroundImage.addEventListener("error", () => {
        lobbyNotification.textContent = "Không tải được hình nền bắn cung.";
      });
      bowSprite.addEventListener("load", drawLane);
      bowSprite.addEventListener("error", () => {
        lobbyNotification.textContent = "Không tải được ảnh cung thủ cung.png.";
      });
      updateControls();
      renderRoomBoard();
    </script>
  </body>
</html>
